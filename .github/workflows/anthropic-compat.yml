name: Multi-room foundation and Anthropic compatibility

on:
  push:
    branches: [feature/multi-room]
  pull_request:

permissions:
  contents: read

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install offline test dependencies
        run: python -m pip install -e '.[test,http,background]'
      - name: Compile Python package
        run: python -m compileall -q src
      - name: Verify room isolation and chat-gateway compatibility
        run: >-
          python -m pytest -q
          tests/test_anthropic_thinking_usage.py
          tests/test_chat_image_transport.py
          tests/test_chat_upstream_errors.py
          tests/test_upstream_catalog.py
          tests/test_room_manager.py
          tests/test_room_gateway.py
          tests/test_room_admin.py
      - name: Verify reviewed release manifest
        run: python scripts/release.py /tmp/serein-multiroom-test.zip

  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install the unchanged original Dashboard dependencies
        run: npm ci --prefix web
      - name: Check authenticated multi-room routing and storage tests
        run: node --test web/tests/room-session.test.mjs web/tests/room-dashboard-routes.test.mjs
      - name: Build original React Dashboard with opt-in room selector
        run: npm --prefix web run build
      - name: Check web gateway JavaScript syntax
        run: node --check web/server/gateway.mjs
