name: Codex runner compatibility

on:
  pull_request:
    branches: [codex-server]
    paths:
      - 'src/serein/codex_runner.py'
      - 'src/serein/api/chat.py'
      - 'src/serein/api/host.py'
      - 'src/serein/model_runtime.py'
      - 'tests/test_codex_runner*.py'
      - 'tests/test_host_turn_archive.py'
      - 'tests/test_chat_eyes_fallback.py'
      - '.github/workflows/codex-runner-compat.yml'
  workflow_dispatch:

jobs:
  runner-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project and pytest
        run: python -m pip install -e '.[http]' pytest
      - name: Compile modified modules
        run: python -m py_compile src/serein/codex_runner.py src/serein/api/chat.py src/serein/api/host.py src/serein/model_runtime.py
      - name: Verify Runner and upstream integration
        run: python -m pytest -q tests/test_codex_runner.py tests/test_codex_runner_compat.py tests/test_host_turn_archive.py tests/test_chat_eyes_fallback.py tests/test_public_settings.py
